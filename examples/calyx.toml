# Configuração dos exemplos: onde rodam as tools e (se preciso) os modelos.
#
# Modelos gemini-*, gpt-* e nvidia/* já têm provedor embutido; a chave vem
# de uma variável de ambiente (GEMINI_API_KEY, OPENAI_API_KEY, NVIDIA_API_KEY).
# Outro provedor compatível com a API da OpenAI entra assim:
#
#   [providers.local]
#   url = "http://localhost:11434/v1"
#   key_env = "OLLAMA_KEY"
#   models = ["llama"]

# Cada tool roda num servidor MCP (decisão D34). Caminhos relativos a este arquivo.
[tools.web_search]
command = ["python3", "tools/fake_search.py"]

# Preços por modelo, em USD por milhão de tokens, para `limits budget`.
# Confira os valores do seu provedor; sem preço, o orçamento não conta o modelo.
#
#   [prices."gemini-3.5-flash-lite"]   # valores ilustrativos
#   input = 0.10
#   output = 0.40
#
# Plano gratuito com limite de requisições? Limite o ritmo no grafo:
#   limits rate 15/min

# A loja falsa do examples/refund.clyx: pedidos, reembolsos e e-mail.
[tools.get_order]
command = ["python3", "tools/fake_store.py"]

[tools.refund]
command = ["python3", "tools/fake_store.py"]

[tools.email]
command = ["python3", "tools/fake_store.py"]

[tools.email_sent]
command = ["python3", "tools/fake_store.py"]
