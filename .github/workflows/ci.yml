name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The journal in PostgreSQL (tests/postgres.rs): a database for the tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: calyx
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calyx"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CALYX_TEST_DATABASE_URL: postgresql://calyx@127.0.0.1:5432/calyx
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Lint
        run: |
          make lint
          shellcheck install.sh

      - name: Test (Rust compiler + C runtime)
        run: make test

      - name: The journal in PostgreSQL over TLS (a server with its own CA)
        run: |
          tls="$RUNNER_TEMP/tls"
          mkdir -p "$tls" && cd "$tls"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.pem -days 2 -subj "/CN=calyx test CA"
          openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
          printf 'subjectAltName=DNS:localhost\nextendedKeyUsage=serverAuth\n' > ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 2 -extfile ext
          sudo chown 999:999 server.key server.pem && sudo chmod 600 server.key
          docker run -d --name pgtls -p 5433:5432 -e POSTGRES_USER=calyx -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$tls:/tls:ro" postgres:16 \
            -c ssl=on -c ssl_cert_file=/tls/server.pem -c ssl_key_file=/tls/server.key
          for _ in $(seq 60); do docker exec pgtls pg_isready -U calyx -h localhost && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          url="postgresql://calyx@localhost:5433/calyx?sslmode=verify-full&sslrootcert=$tls/ca.pem"
          CALYX_TEST_DATABASE_URL="$url" cargo test -p calyx-cli --test postgres
          # A server whose certificate no trusted root signed is refused.
          cargo build
          if CALYX_DATABASE_URL="postgresql://calyx@localhost:5433/calyx?sslmode=require" ./target/debug/calyx runs 2> tls.log; then
            echo "an unknown certificate should be refused"; exit 1
          fi
          grep -q UnknownIssuer tls.log

      - name: Check and run the example with the CLI (fake models, fake MCP search)
        run: |
          cargo build --release
          ./target/release/calyx check examples/research.clyx --ir --time
          ./target/release/calyx check examples/refund.clyx --tools
          ./target/release/calyx check examples/github/repo_agent.clyx
          ./target/release/calyx run examples/research.clyx --fake-models --topic "energia solar"
          ./target/release/calyx run examples/agent.clyx --fake-models --question "baterias de sódio"
          ./target/release/calyx run examples/refund.clyx --fake-models --request R1 --order A100 --message "chegou quebrado"
          ./target/release/calyx run examples/fix.clyx --fake-models --repo examples/sample_repo --issue "average devolve 6"
          ./target/release/calyx run examples/memory.clyx --fake-models --user ana --text "Moro em Recife"
          ./target/release/calyx run examples/memory.clyx --fake-models --user ana --text "Onde eu moro?"
          ./target/release/calyx run examples/debate.clyx --fake-models --question "IA vai substituir programadores?"
          ./target/release/calyx run examples/race.clyx --fake-models --question "Qual a capital da Austrália?"
          ./target/release/calyx run examples/router.clyx --fake-models --ticket "Fui cobrado duas vezes"
          ./target/release/calyx run examples/saga.clyx --request R1
          ./target/release/calyx run examples/atendimento.clyx --graph atender --fake-models --cliente ana --pedido A100 --mensagem "Como troco o endereço?"

      - name: The README snippets check, and the unsafe one is refused
        run: |
          for f in refund research approval agent; do
            ./target/release/calyx check examples/readme/$f.clyx
          done
          if ./target/release/calyx check examples/readme/refund_unsafe.clyx > unsafe.log 2>&1; then
            echo "refund_unsafe.clyx should not pass"; exit 1
          fi
          grep -q E0304 unsafe.log && grep -q W0601 unsafe.log && grep -q W0602 unsafe.log

      - name: The LIMBO programs compile under both contracts
        run: |
          for c in native keys; do
            cat bench/limbo/programs/tools_$c.clyx bench/limbo/programs/tasks.clyx > "$RUNNER_TEMP/limbo_$c.clyx"
            ./target/release/calyx check "$RUNNER_TEMP/limbo_$c.clyx"
          done

      - name: Wait for a message, deliver it, continue (receive)
        run: |
          set +e
          ./target/release/calyx run examples/approval.clyx --fake-models --request "reembolso" 2> wait.log
          code=$?
          set -e
          cat wait.log
          test "$code" -eq 4
          id=$(sed -n 's/^calyx: run //p' wait.log)
          ./target/release/calyx deliver "$id" Approval Approved
          ./target/release/calyx resume "$id" --fake-models

      - name: Build a standalone program and run it from another directory
        run: |
          ./target/release/calyx build examples/agent.clyx -o "$RUNNER_TEMP/agent"
          cd "$RUNNER_TEMP" && ./agent --fake-models --quiet --question "baterias de sódio"

  # Windows, natively (no WSL): the GNU toolchain (MinGW-w64), as the
  # release builds it. The runtime's few POSIX calls go through
  # runtime/src/compat.h. Postgres and sandbox-on-Postgres tests skip.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: MinGW-w64 gcc, for the C runtime
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Put MinGW-w64 on the PATH
        run: echo "$RUNNER_TEMP/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: python3, as the tests' fake MCP servers are started
        run: |
          dir=$(dirname "$(command -v python)")
          [ -e "$dir/python3.exe" ] || cp "$dir/python.exe" "$dir/python3.exe"
          python3 --version

      - name: Test
        run: cargo test

      - name: The CLI on Windows (fake models, fake MCP search)
        run: |
          cargo build --release
          calyx=./target/release/calyx.exe
          $calyx --version
          $calyx run examples/research.clyx --fake-models --quiet --topic "energia solar"
          $calyx run examples/refund.clyx --fake-models --quiet --request R1 --order A100 --message "chegou quebrado"
          # A run that dies half-way resumes without redoing what finished.
          set +e
          CALYX_CRASH_AFTER=2 $calyx run examples/research.clyx --fake-models --quiet --topic baterias 2> crash.log
          set -e
          id=$(sed -n 's/^calyx: run //p' crash.log | tr -d '\r')
          $calyx resume "$id" --fake-models --quiet 2>&1 | tee resume.log
          # A standalone program.
          $calyx build examples/agent.clyx -o "$RUNNER_TEMP/agent.exe"
          "$RUNNER_TEMP/agent.exe" --fake-models --quiet --question "baterias de sódio"

      - name: install.ps1 against an archive of this build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Force -Path target/release/calyx.exe -DestinationPath dist/calyx-x86_64-pc-windows-gnu.zip
          $hash = (Get-FileHash dist/calyx-x86_64-pc-windows-gnu.zip -Algorithm SHA256).Hash.ToLower()
          Set-Content dist/calyx-x86_64-pc-windows-gnu.zip.sha256 "$hash  calyx-x86_64-pc-windows-gnu.zip"
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--directory','dist' -PassThru
          Start-Sleep 2
          $env:CALYX_BASE_URL = 'http://127.0.0.1:8765'
          $env:CALYX_INSTALL = "$env:RUNNER_TEMP\calyx"
          $env:CALYX_NO_MODIFY_PATH = '1'
          ./install.ps1
          & "$env:RUNNER_TEMP\calyx\bin\calyx.exe" --version
          $v = ((& "$env:RUNNER_TEMP\calyx\bin\calyx.exe" --version) -split ' ')[1]
          & "$env:RUNNER_TEMP\calyx\versions\$v\calyx.exe" --version
          Stop-Process $server

  # The C runtime under libFuzzer, AddressSanitizer and UBSan: the parser,
  # the journal, the answers of models and tools, and the IR (runtime/fuzz/).
  # A minute per target on the corpus, which keeps every input that once
  # crashed it.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: clang with libFuzzer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 libclang-rt-18-dev

      - name: Fuzz each target for 60 s
        run: make -C runtime fuzz-run FUZZ_CC=clang-18 FUZZ_SECONDS=60

      - name: Keep the inputs that crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: runtime/build/crash-*

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.34.1
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check the mechanized effect rules
        run: |
          lean formal/Effects.lean
          ! grep -n 'sorry' formal/Effects.lean
