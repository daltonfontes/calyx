name: Release

# Prebuilt, self-contained `calyx` binaries (decision D35): people who
# install Calyx need neither Rust nor a C compiler.
#
# Pushing a tag `vX.Y.Z` (matching the version in Cargo.toml) publishes a
# GitHub release with one archive per target and its checksum, which
# install.sh downloads. Running it by hand with a `tag` does the same,
# creating the tag on the commit it ran on. Without a tag, or on a pull
# request that changes the release, it only builds and keeps the archives
# as artifacts.

on:
  push:
    tags: ["v*"]
  # Builds (without publishing) when the release itself changes.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "install.sh"
      - "compiler/calyx-cli/src/bundle.rs"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish (e.g. v0.1.0); empty only builds"
        required: false
        default: ""

permissions:
  contents: read

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  # Without it, macOS binaries require the runner's own (latest) macOS.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static binaries (musl), cross-compiled with zig.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            run: qemu-aarch64
          - target: aarch64-apple-darwin
            os: macos-latest
            run: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            run: arch -x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig (Linux)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install qemu, to try the ARM binary (Linux)
        if: matrix.run == 'qemu-aarch64'
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Check that the tag matches the version
        if: env.TAG != ''
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }} -p calyx-cli
          else
            cargo build --release --locked --target ${{ matrix.target }} -p calyx-cli
          fi

      - name: Smoke test (the binary and a program built with it)
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/calyx
          file "$bin"
          if [ "$RUNNER_OS" = Linux ]; then
            file "$bin" | grep -q "statically linked"
          else
            otool -L "$bin"
            otool -l "$bin" | grep -m1 minos
          fi
          ${{ matrix.run }} "$bin" --version
          ${{ matrix.run }} "$bin" build examples/research.clyx -o examples/research
          ${{ matrix.run }} examples/research --fake-models --quiet --no-journal --topic "energia solar"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          name=calyx-${{ matrix.target }}
          tar -czf dist/$name.tar.gz -C target/${{ matrix.target }}/release calyx
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum $name.tar.gz > $name.tar.gz.sha256
          else
            shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: calyx-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Test install.sh against the new archives
        run: |
          cd dist && python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          CALYX_BASE_URL=http://127.0.0.1:8765 CALYX_INSTALL="$RUNNER_TEMP/calyx" sh install.sh
          "$RUNNER_TEMP/calyx/bin/calyx" --version

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag on this commit when it does not exist yet.
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
