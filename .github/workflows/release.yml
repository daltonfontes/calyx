name: Release

# Prebuilt, self-contained `calyx` binaries (decision D35): people who
# install Calyx need neither Rust nor a C compiler.
#
# Pushing a tag `vX.Y.Z` (matching the version in Cargo.toml) publishes a
# GitHub release with one archive per target and its checksum, which
# install.sh downloads. Running it by hand with a `tag` does the same,
# creating the tag on the commit it ran on. Without a tag, or on a pull
# request that changes the release, it only builds and keeps the archives
# as artifacts.

on:
  push:
    tags: ["v*"]
  # Builds (without publishing) when the release itself changes.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "install.sh"
      - "install.ps1"
      - "compiler/calyx-cli/src/bundle.rs"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish (e.g. v0.1.0); empty only builds"
        required: false
        default: ""

permissions:
  contents: read

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  # Without it, macOS binaries require the runner's own (latest) macOS.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static binaries (musl), cross-compiled with zig.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            run: ""
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            run: qemu-aarch64
          - target: aarch64-apple-darwin
            os: macos-latest
            run: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            run: arch -x86_64
          # Windows: MinGW-w64 (runtime/src/compat.h), no DLLs beyond Windows'.
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            run: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'
        with:
          targets: ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: MinGW-w64 gcc (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Put MinGW-w64 on the PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$RUNNER_TEMP/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Install zig (Linux)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install qemu, to try the ARM binary (Linux)
        if: matrix.run == 'qemu-aarch64'
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Check that the tag matches the version
        if: env.TAG != ''
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match version $version in Cargo.toml"
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }} -p calyx-cli
          else
            cargo build --release --locked --target ${{ matrix.target }} -p calyx-cli
          fi

      - name: Smoke test (the binary and a program built with it)
        shell: bash
        run: |
          exe=""
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          bin=target/${{ matrix.target }}/release/calyx$exe
          if [ "$RUNNER_OS" = Linux ]; then
            file "$bin"
            file "$bin" | grep -q "statically linked"
          elif [ "$RUNNER_OS" = macOS ]; then
            file "$bin"
            otool -L "$bin"
            otool -l "$bin" | grep -m1 minos
          else
            # Only Windows' own DLLs (no MinGW runtime to ship).
            objdump -p "$bin" | grep "DLL Name" | sort -u
            ! objdump -p "$bin" | grep -qiE "DLL Name: (libgcc|libwinpthread|libstdc)"
          fi
          ${{ matrix.run }} "$bin" --version
          ${{ matrix.run }} "$bin" build examples/research.clyx -o examples/research$exe
          ${{ matrix.run }} examples/research$exe --fake-models --quiet --no-journal --topic "energia solar"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          name=calyx-${{ matrix.target }}
          if [ "$RUNNER_OS" = Windows ]; then
            archive=$name.zip
            7z a -tzip dist/$archive ./target/${{ matrix.target }}/release/calyx.exe
          else
            archive=$name.tar.gz
            tar -czf dist/$archive -C target/${{ matrix.target }}/release calyx
          fi
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum $archive > $archive.sha256
          else
            shasum -a 256 $archive > $archive.sha256
          fi

      - name: Test install.ps1 against the new archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--directory','dist' -PassThru
          Start-Sleep 2
          $env:CALYX_BASE_URL = 'http://127.0.0.1:8765'
          $env:CALYX_INSTALL = "$env:RUNNER_TEMP\calyx"
          $env:CALYX_NO_MODIFY_PATH = '1'
          ./install.ps1
          & "$env:RUNNER_TEMP\calyx\bin\calyx.exe" --version
          Stop-Process $server

      - uses: actions/upload-artifact@v4
        with:
          name: calyx-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Test install.sh against the new archives
        run: |
          cd dist && python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          CALYX_BASE_URL=http://127.0.0.1:8765 CALYX_INSTALL="$RUNNER_TEMP/calyx" sh install.sh
          "$RUNNER_TEMP/calyx/bin/calyx" --version
          # The copy that finishes this version's runs after an upgrade.
          "$RUNNER_TEMP/calyx/versions/${TAG#v}/calyx" --version

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag on this commit when it does not exist yet.
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
